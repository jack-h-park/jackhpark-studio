name: Sitemap Availability

# Runs after a production deployment goes live, when the ISR cache is cold.
# A verified deck-only or independent static-page diff uses representative paths; unknown or runtime changes
# retain the full sitemap sweep. Manual runs always use full coverage. A build that quietly dropped pages is
# invisible to Prod Availability — that watches nine top-level routes, and the
# 2026-09-03 incident killed 48 leaf pages while all nine stayed green.
#
# Deliberately not on a schedule. Pages are generated on demand, so every cold
# URL costs a Notion fetch; sweeping all of them every few minutes would rebuild
# the same rate-limit storm that caused the incident and aim it at live traffic.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to sweep"
        required: false
        default: https://www.jackhpark.com

permissions:
  contents: read
  deployments: read
  actions: read

concurrency:
  group: sitemap-availability
  cancel-in-progress: true

jobs:
  sweep:
    name: Sitemap sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # deployment_status fires for previews and for every non-success state too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Prepare static page analyzer
        # A failed/missing analyzer retains full coverage in the scope selector.
        continue-on-error: true
        run: npm ci --prefix scripts/smoke/static-page-analyzer --ignore-scripts --no-audit --no-fund

      - name: Select verification scope
        # A historical redeploy may not contain the optional scope tool.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATIC_PAGE_TYPESCRIPT_PATH: ${{ github.workspace }}/scripts/smoke/static-page-analyzer/node_modules/typescript/lib/typescript.js
        run: node scripts/smoke/deployment-sweep-scope.mjs

      - name: Verify deployment
        env:
          PROD_BASE_URL: ${{ inputs.base_url || 'https://www.jackhpark.com' }}
          # Low on purpose: this must not become the thing that rate-limits
          # Notion. See the header comment in the script.
          SITEMAP_CONCURRENCY: "4"
          SWEEP_PLAN_PATH: deployment-sweep-plan.json
        run: node scripts/smoke/sitemap-availability.mjs
