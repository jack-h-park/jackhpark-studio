name: Live Notion Build Validation

# Explicit integration check, not a schedule or an automatic duplicate crawl.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-live-validation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm build
