name: Prod Availability

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Use full for low-frequency extended route checks"
        required: false
        default: core
  schedule:
    # GitHub does not honour this, and the number is kept only because asking
    # for less does not make it fire sooner. Measured over 38 scheduled runs
    # between 2026-09-01 and 2026-09-06: median interval 192 minutes, fastest
    # 104, slowest 332, and NOT ONE interval at or under six minutes. No runs
    # were cancelled — scheduled workflows on public repos are best-effort, and
    # this is what best-effort turns out to mean here.
    #
    # So do not read this as five-minute coverage, and do not delete a monitor
    # elsewhere on the grounds that this already covers it — that reasoning is
    # what left three Notion content pages on a ~3.5 hour signal until
    # __checks__/production-availability.check.ts took them back. Checkly is
    # what delivers an actual cadence (30m, and it holds); this is the free
    # backstop that runs a wider set of routes with body assertions a
    # UrlMonitor cannot make.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: prod-availability
  cancel-in-progress: true

jobs:
  smoke:
    name: Canonical Prod smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run canonical route checks
        env:
          PROD_BASE_URL: https://www.jackhpark.com
          SMOKE_SCOPE: ${{ inputs.scope || 'core' }}
        run: node scripts/smoke/prod-availability.mjs
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram notification skipped: repository secrets are not configured."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --header 'Content-Type: application/json' \
            --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🚨 Prod availability check failed\\nURL: https://www.jackhpark.com/chat\\nRun: ${GITHUB_RUN_URL}\"}"
